name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Filet de sécurité minimal avant chaque déploiement :
# génération du client Prisma + typecheck + lint + build (tous bloquants).
jobs:
  build:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build (inclut le typecheck TypeScript)
        run: npm run build
        env:
          # Build statique : pas de connexion BDD requise (pages force-dynamic).
          # Valeur factice pour satisfaire l'éventuelle lecture d'env.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
